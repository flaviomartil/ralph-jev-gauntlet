site_name: ralph-jev-gauntlet
site_description: Agent loop that ends only when a separate critic approves the work blind
site_url: https://github.com/flaviomartil/ralph-jev-gauntlet
repo_url: https://github.com/flaviomartil/ralph-jev-gauntlet
repo_name: flaviomartil/ralph-jev-gauntlet
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Concepts:
    - Loop lifecycle: concepts/loop-lifecycle.md
    - Gauntlet gate: concepts/gauntlet.md
    - Judge evidence: concepts/judge-evidence.md
    - Jev hooks: concepts/jev-hooks.md
    - Parallel loops: concepts/parallel-loops.md
  - Guide:
    - Configuration: guide/configuration.md
  - Reference:
    - Troubleshooting: reference/troubleshooting.md
  - Development:
    - Testing: development/testing.md
  - Architecture: architecture/index.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
